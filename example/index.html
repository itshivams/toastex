<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toastex Example</title>
  <link rel="stylesheet" href="./dist/toastex.css?v=2">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f3f4f6;
      color: #1f2937;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-success { background: #10b981; }
    .btn-error { background: #ef4444; }
    .btn-warning { background: #f59e0b; }
    .btn-dark { background: #1f2937; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Toastex 🍞</h1>
    <p>A robust, enterprise-standard vanilla JS/TS toast notification library.</p>
    
    <h3>Standard Types</h3>
    <div class="grid">
      <button onclick="Toastex.success('Operation completed successfully!', { title: 'Success', sound: true })" class="btn-success">Success (Sound)</button>
      <button onclick="Toastex.error('Failed to save data. Please try again.', { title: 'Error', sound: true })" class="btn-error">Error (Sound)</button>
      <button onclick="Toastex.warning('Your session is about to expire.', { title: 'Warning', sound: true })" class="btn-warning">Warning (Sound)</button>
      <button onclick="Toastex.info('New update is available.', { title: 'Info', sound: true })">Info (Sound)</button>
      <button onclick="Toastex.show('Just a simple message without a title.')">Default</button>
    </div>

    <h3>Themes, Logos & Variants</h3>
    <div class="grid">
      <button onclick="Toastex.success('Dark theme notification', { theme: 'dark' })" class="btn-dark">Dark Theme</button>
      <button onclick="Toastex.show({ message: 'Custom Logo Toast', logoUrl: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png', theme: 'light' })" style="background: white; color: black; border: 1px solid #ccc;">Custom Logo (Light)</button>
      <button onclick="Toastex.show({ message: 'Custom Logo Toast (Dark)', logoUrl: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png', theme: 'dark' })" class="btn-dark">Custom Logo (Dark)</button>
      <button onclick="Toastex.success('Action successful!', { variant: 'swift', theme: 'light' })" class="btn-success">Swift (Light)</button>
      <button onclick="Toastex.error('Login failed: invalid credentials', { variant: 'swift', theme: 'dark' })" class="btn-dark">Swift (Dark)</button>
      <button onclick="Toastex.show({ title: 'John Doe', message: 'Hey! Are we still on for the meeting?', variant: 'chat', logoUrl: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png' })" style="background: white; color: black; border: 1px solid #ccc;">Chat Variant</button>
      <button onclick="Toastex.info('Saved', { variant: 'minimal' })" style="background: #333; color: white;">Minimal</button>
      <button onclick="Toastex.success('Outline look!', { variant: 'outline', theme: 'light' })" style="background: transparent; color: black; border: 2px solid #22c55e;">Outline</button>
      <button onclick="Toastex.show({ title: 'iMessage', message: 'Hey! Are we still on for the meeting?', variant: 'liquid-glass', logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/5/51/IMessage_logo.svg', theme: 'light', position: 'top-center' })" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; border: 1px solid #fff;">Liquid Glass (Light)</button>
      <button onclick="Toastex.show({ title: 'System', message: 'Your battery is running low.', variant: 'liquid-glass', theme: 'dark', position: 'top-center' })" style="background: linear-gradient(135deg, #434343 0%, #000000 100%); color: white; border: 1px solid #333;">Liquid Glass (Dark)</button>
      <button onclick="Toastex.show({ title: 'Armando Cajide', subtitle: 'Gym Training', message: 'Anyone up for powerlifting this weekend?', time: 'now', variant: 'liquid-chat', avatarUrl: 'https://avatars.githubusercontent.com/u/9919?v=4', appIconUrl: 'https://upload.wikimedia.org/wikipedia/commons/5/51/IMessage_logo.svg', theme: 'light', position: 'top-center' })" style="background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); color: #333; border: 1px solid #fff;">Liquid Chat (Light)</button>
      <button onclick="Toastex.show({ title: 'Ashley Rico', subtitle: 'To you & Dawn Ramirez', message: 'Want to come over to our place for dinner tonight? We\'re grilling and the kids are baking cookies 🍪 for dessert.', time: '2m ago', variant: 'liquid-chat', avatarUrl: 'https://avatars.githubusercontent.com/u/1024025?v=4', appIconUrl: 'https://upload.wikimedia.org/wikipedia/commons/5/51/IMessage_logo.svg', theme: 'dark', position: 'top-center' })" style="background: linear-gradient(135deg, #243B55 0%, #141E30 100%); color: white; border: 1px solid #333;">Liquid Chat (Dark)</button>
    </div>

    <h3>Behavior & Positioning</h3>
    <div class="grid">
      <button onclick="Toastex.info('This will stay for 10 seconds', { duration: 10 })">Long Duration (10s)</button>
      <button onclick="Toastex.info('This will not auto-close', { duration: 0 })">No Timeout</button>
      <button onclick="Toastex.success('Top Left!', { position: 'top-left' })">Top Left</button>
      <button onclick="Toastex.success('Top Center!', { position: 'top-center' })">Top Center</button>
      <button onclick="Toastex.success('Bottom Left!', { position: 'bottom-left' })">Bottom Left</button>
      <button onclick="Toastex.success('Bottom Center!', { position: 'bottom-center' })">Bottom Center</button>
    </div>
  </div>

  <script src="./dist/index.global.js?v=2"></script>
  <script>
    // Map the global export properly
    window.Toastex = window.Toastex.default || window.Toastex.Toastex || window.Toastex;
  </script>
</body>
</html>
